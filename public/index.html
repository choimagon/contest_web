<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeece8">
  <meta name="description" content="IMEL 팀 이름과 Python 파일 제출. 파일 원문은 비공개로 보관됩니다.">
  <title>IMEL — 팀 파일 제출</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/config.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a href="#upload-form" class="skip-link">제출 폼으로 이동</a>
  <header class="header"><h1>IMEL</h1></header>
  <main>
    <div class="reserved-area" aria-hidden="true"></div>
    <div id="connection-notice" class="notice" role="status" hidden><span data-icon="info"></span><span id="notice-text"></span><button id="notice-action" type="button">다시 시도</button></div>
    <div class="workspace">
      <section class="upload-panel" aria-labelledby="upload-heading">
        <h2 id="upload-heading">제출칸</h2>
        <form id="upload-form">
          <label class="field-label" for="team-name">팀 이름 <span>*</span></label>
          <input id="team-name" name="team_name" maxlength="80" required placeholder="팀 이름 입력" autocomplete="organization">
          <div class="file-field-heading"><label class="field-label" for="file-input">파일 이름 <span>*</span></label><span>.py · 최대 5 MB</span></div>
          <div id="drop-zone" class="drop-zone">
            <input id="file-input" type="file" accept=".py" hidden>
            <div id="file-placeholder"><span class="drop-icon" data-icon="code-file"></span><p>.py 파일을 놓거나 선택하세요.</p><button class="button secondary" id="choose-file" type="button">파일 선택</button></div>
            <div id="selected-file" class="selected-file" hidden><strong id="selected-file-name"></strong><span id="selected-file-size"></span><button type="button" class="text-button" id="change-file">다른 파일 선택</button><button type="button" class="icon-button remove-file" id="remove-file" aria-label="선택한 파일 제거" data-icon="x"></button></div>
          </div>
          <p class="upload-error" id="upload-error" role="alert" hidden></p>
          <div class="upload-progress" id="upload-progress" role="status" hidden><span class="spinner"></span><span id="upload-progress-label">파일을 보관하는 중…</span></div>
          <button class="button primary submit-button" id="submit-button" type="submit"><span id="submit-label">제출하기</span></button>
          <p class="upload-caption">로그인 없이 제출 · 파일 원문 비공개</p>
          <span class="status-pill" id="status-pill" role="status">연결 중</span>
        </form>
        <div id="pending-receipt" class="pending-receipt" hidden><strong>제출 상태를 확인해주세요</strong><p id="pending-description"></p><button class="button secondary" id="retry-submission" type="button">목록 등록 다시 시도</button></div>
      </section>
      <section class="list-panel" aria-labelledby="list-heading">
        <h2 id="list-heading">제출목록 <span id="list-count">0</span></h2>
        <div class="list-tools"><label class="search-box"><span data-icon="search"></span><input id="search-input" type="search" aria-label="팀 이름 또는 파일명 검색" placeholder="팀 이름 또는 파일명 검색"></label><button class="icon-button" id="refresh-list" type="button" aria-label="제출 목록 새로고침" title="새로고침" data-icon="refresh"></button></div>
        <div class="table-container">
          <table><thead><tr><th scope="col">팀 이름</th><th scope="col">파일 이름</th><th scope="col" title="한국 시간 (UTC+9)">시간<span class="column-detail">(초까지)</span></th><th scope="col">결과</th></tr></thead><tbody id="submissions-body"></tbody></table>
          <div class="empty-state" id="empty-state"><h3 id="empty-title">아직 제출된 파일이 없습니다.</h3><p id="empty-description">팀 이름과 .py 파일을 제출해주세요.</p></div>
        </div>
        <div class="list-footer"><span id="list-footer-count">총 0개 파일</span><span>시간은 한국 시간 기준</span></div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span data-icon="check-circle"></span><span id="toast-message"></span></div>
  <noscript><p class="noscript">파일 제출을 사용하려면 JavaScript를 활성화해주세요.</p></noscript>
</body>
</html>
